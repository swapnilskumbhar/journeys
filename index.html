<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Journeys — scroll through time, distance and scale</title>
    <meta
      name="description"
      content="Interactive 3D journeys: the Big Bang to today, Earth to the edge of the observable universe, launch pad to Mars — one continuous world, one scroll."
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph / link unfurls. Present from the first commit on purpose:
         a link with no card renders as a blank rectangle everywhere it is
         shared, and sharing is the whole distribution plan. Per-route values
         are injected by the prerender step at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Journeys" />
    <meta property="og:title" content="Journeys — scroll through time, distance and scale" />
    <meta
      property="og:description"
      content="Interactive 3D journeys: the Big Bang to today, Earth to the edge of the observable universe, launch pad to Mars."
    />
    <meta property="og:image" content="/og/default.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#02030a" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
