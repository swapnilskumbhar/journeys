name: Deploy to GitHub Pages

# FIRST-RUN SETUP, once, by hand:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Do not skip it on the strength of `enablement: true` below. Read the two
# failures in order, because they are different problems:
#
#   "Get Pages site failed … Not Found"        → 404: Pages is not enabled.
#   "Create Pages site failed … Resource not
#    accessible by integration"                → 403: enabling was REFUSED.
#
# The second is not a workflow problem — `pages: write` is granted below, so the
# token is asking correctly and being denied at the repo or plan level. Pages is
# only available on private repos with Pro/Team/Enterprise; on a free plan the
# repo has to be public. Setting the source by hand is also simply more
# reliable than having GITHUB_TOKEN create the site.
#
# `enablement: true` stays because once Pages exists the action finds it on the
# Get call and never attempts the Create — so it costs nothing here and saves
# the setup step for anyone who forks this.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Not cancel-in-progress: a half-finished deploy
# that gets cancelled can leave the live site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The axis and pacing checks need no browser, so they are free here and
      # they are the ones that fail in ways a screenshot would never catch.
      # The visual checks (shots.mjs, scroll-check.mjs) are deliberately NOT
      # here: they need a dev server and a Chromium download, and their output
      # is images that have to be looked at by a person to mean anything.
      - name: Engine + axis smoke
        run: node scripts/smoke.mjs

      - name: Build
        run: npm run build
        env:
          # Change both of these together if the site ever moves. For a custom
          # domain it is SITE_BASE=/ plus a public/CNAME file.
          SITE_BASE: /journeys/
          SITE_ORIGIN: https://swapnilskumbhar.github.io

      # enablement: turn Pages on if it is not already, instead of erroring.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
